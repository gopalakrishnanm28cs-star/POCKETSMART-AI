<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketSmart AI — Budget & Recommendation Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#0F1B1A; --surface:#16241F; --surface2:#1D2F29; --line:#2A3D36;
    --ink:#EAF2EE; --muted:#8FA69B; --mint:#3ECF8E; --gold:#E8B75A; --clay:#E8735A;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F4F2ED; --surface:#FFFFFF; --surface2:#ECEAE2; --line:#DAD6C9;
      --ink:#1B2420; --muted:#5E6E66; --mint:#1E9A63; --gold:#B4801E; --clay:#C4573A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1B1A; --surface:#16241F; --surface2:#1D2F29; --line:#2A3D36;
    --ink:#EAF2EE; --muted:#8FA69B; --mint:#3ECF8E; --gold:#E8B75A; --clay:#E8735A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
  .display{font-family:Fraunces,serif;}
  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 60px;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:22px;}
  header h1{font-size:22px; margin:0; font-weight:600;}
  header .sub{color:var(--muted); font-size:13px;}
  .theme-toggle{background:none; border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:Inter,sans-serif;}
  .hero{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:26px 24px; margin-bottom:18px;}
  .hero .label{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .hero .amount{font-size:clamp(38px,9vw,58px); line-height:1; margin:0; font-weight:500;}
  .hero .amount.neg{color:var(--clay);} .hero .amount.pos{color:var(--mint);}
  .hero-row{display:flex; flex-wrap:wrap; gap:22px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .hero-stat{flex:1; min-width:110px;}
  .hero-stat .k{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin-bottom:4px;}
  .hero-stat .v{font-size:18px; font-weight:600;}
  .goal-line{display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap;}
  .goal-line label{font-size:12.5px; color:var(--muted);}
  .goal-line input{width:120px;}
  .grid{display:grid; grid-template-columns:1.05fr 1fr; gap:18px;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} }
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:18px;}
  .panel h2{font-size:15px; margin:0 0 14px; font-weight:600;}
  form{display:flex; flex-direction:column; gap:10px;}
  .row2{display:flex; gap:10px;} .row2 > *{flex:1;}
  input, select{background:var(--surface2); border:1px solid var(--line); color:var(--ink); border-radius:4px; padding:10px 11px; font-size:14px; font-family:Inter,sans-serif; width:100%;}
  input::placeholder{color:var(--muted);}
  .kind-toggle{display:flex; gap:8px;}
  .kind-btn{flex:1; padding:9px; border-radius:4px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); cursor:pointer; font-size:13px; font-family:Inter,sans-serif; font-weight:600;}
  .kind-btn.active[data-kind="expense"]{background:rgba(232,115,90,0.15); border-color:var(--clay); color:var(--clay);}
  .kind-btn.active[data-kind="income"]{background:rgba(62,207,142,0.15); border-color:var(--mint); color:var(--mint);}
  button.submit{margin-top:4px; background:var(--mint); color:#0B1512; border:none; border-radius:4px; padding:11px; font-weight:700; font-size:14px; cursor:pointer; font-family:Inter,sans-serif;}
  .list{display:flex; flex-direction:column; margin-top:4px; max-height:230px; overflow-y:auto;}
  .txn{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; gap:10px;}
  .txn:last-child{border-bottom:none;}
  .txn .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .txn .amt.income{color:var(--mint); font-weight:600;} .txn .amt.expense{color:var(--ink); font-weight:600;}
  .txn button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; padding:4px;}
  .empty{color:var(--muted); font-size:13px; padding:16px 0;}
  .bars{display:flex; flex-direction:column; gap:12px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .bar-track{height:7px; background:var(--surface2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--mint); border-radius:4px;}
  .bar-fill.over{background:var(--clay);}
  .bar-cap{font-size:11px; color:var(--muted); margin-top:3px;}
  .rec{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5;}
  .rec:last-child{border-bottom:none;}
  .rec .tag{flex-shrink:0; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; padding:3px 7px; border-radius:3px; height:fit-content; margin-top:1px;}
  .tag.high{background:rgba(232,115,90,0.18); color:var(--clay);}
  .tag.mid{background:rgba(232,183,90,0.18); color:var(--gold);}
  .tag.low{background:rgba(62,207,142,0.18); color:var(--mint);}
  footer{text-align:center; color:var(--muted); font-size:11.5px; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="display">PocketSmart AI</h1>
      <div class="sub">Your smart budget & recommendation assistant</div>
    </div>
    <button class="theme-toggle" id="themeToggle">Dark / Light</button>
  </header>

  <div class="hero">
    <div class="label">Balance this month</div>
    <p class="amount" id="balanceAmt">$0.00</p>
    <div class="hero-row">
      <div class="hero-stat"><div class="k">Income</div><div class="v" id="totalIncome">$0.00</div></div>
      <div class="hero-stat"><div class="k">Spent</div><div class="v" id="totalExpense">$0.00</div></div>
      <div class="hero-stat"><div class="k">Savings rate</div><div class="v" id="savingsRate">—</div></div>
    </div>
    <div class="goal-line">
      <label for="goalInput">Monthly savings goal</label>
      <input type="number" id="goalInput" placeholder="$0" min="0" step="1">
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>Add a transaction</h2>
        <form id="txnForm">
          <div class="kind-toggle">
            <button type="button" class="kind-btn active" data-kind="expense">Expense</button>
            <button type="button" class="kind-btn" data-kind="income">Income</button>
          </div>
          <div class="row2">
            <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required>
            <select id="category"></select>
          </div>
          <input type="text" id="note" placeholder="Note (optional)">
          <button type="submit" class="submit">Add</button>
        </form>
      </div>
      <div class="panel">
        <h2>Recent activity</h2>
        <div class="list" id="txnList"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Where it's going</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="panel">
        <h2>Recommendations</h2>
        <div id="insights"></div>
      </div>
    </div>
  </div>

  <footer>Stored only on this device, in this browser. Recommendations are rule-based, not financial advice.</footer>
</div>

<script>
(function(){
  var STORE_KEY = 'pocketsmart_ai_txns_v1';
  var GOAL_KEY = 'pocketsmart_ai_goal_v1';
  var EXPENSE_CATS = ['Food','Housing','Transport','Fun','Shopping','Bills','Health','Other'];
  var INCOME_CATS = ['Salary','Freelance','Gift','Other'];
  // suggested healthy caps as % of income, used only when income is known
  var SUGGESTED_PCT = {Housing:30, Food:12, Transport:10, Bills:10, Health:5, Shopping:8, Fun:5, Other:5};
  var kind = 'expense';
  var txns = [];
  var goal = 0;

  function loadAll(){
    try{ var raw = localStorage.getItem(STORE_KEY); txns = raw ? JSON.parse(raw) : []; }catch(e){ txns = []; }
    try{ var g = localStorage.getItem(GOAL_KEY); goal = g ? parseFloat(g) : 0; }catch(e){ goal = 0; }
  }
  function saveTxns(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(txns)); }catch(e){} }
  function saveGoal(){ try{ localStorage.setItem(GOAL_KEY, String(goal)); }catch(e){} }

  function fmt(n){ return (n<0?'-':'') + '$' + Math.abs(n).toFixed(2); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var categorySelect = document.getElementById('category');
  function refreshCategoryOptions(){
    var cats = kind === 'expense' ? EXPENSE_CATS : INCOME_CATS;
    categorySelect.innerHTML = cats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  }
  document.querySelectorAll('.kind-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.kind-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      kind = btn.getAttribute('data-kind');
      refreshCategoryOptions();
    });
  });
  refreshCategoryOptions();

  document.getElementById('txnForm').addEventListener('submit', function(e){
    e.preventDefault();
    var amt = parseFloat(document.getElementById('amount').value);
    if(!amt || amt <= 0) return;
    txns.unshift({
      id: Date.now(), kind: kind, amount: amt,
      category: categorySelect.value,
      note: document.getElementById('note').value.trim(),
      date: new Date().toISOString()
    });
    saveTxns();
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    render();
  });

  var goalInput = document.getElementById('goalInput');
  goalInput.addEventListener('input', function(){
    goal = parseFloat(goalInput.value) || 0;
    saveGoal();
    render();
  });

  function removeTxn(id){ txns = txns.filter(function(t){ return t.id !== id; }); saveTxns(); render(); }
  window.__pocketsmart_remove = removeTxn;

  function renderList(){
    var list = document.getElementById('txnList');
    if(txns.length === 0){ list.innerHTML = '<div class="empty">No transactions yet. Add your first one above.</div>'; return; }
    list.innerHTML = txns.slice(0,30).map(function(t){
      var d = new Date(t.date);
      var dateStr = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
      var sign = t.kind === 'income' ? '+' : '−';
      return '<div class="txn"><div><div>'+t.category+(t.note ? ' · '+escapeHtml(t.note) : '')+'</div>'+
        '<div class="meta">'+dateStr+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
        '<span class="amt '+t.kind+'">'+sign+fmt(t.amount).replace('-','')+'</span>'+
        '<button aria-label="Delete" onclick="window.__pocketsmart_remove('+t.id+')">×</button></div></div>';
    }).join('');
  }

  function computeStats(){
    var income = 0, expense = 0, catTotals = {};
    txns.forEach(function(t){
      if(t.kind === 'income'){ income += t.amount; }
      else{ expense += t.amount; catTotals[t.category] = (catTotals[t.category]||0) + t.amount; }
    });
    return {income:income, expense:expense, balance: income-expense, catTotals:catTotals};
  }

  function renderHero(stats){
    var balEl = document.getElementById('balanceAmt');
    balEl.textContent = fmt(stats.balance);
    balEl.className = 'amount ' + (stats.balance < 0 ? 'neg' : 'pos');
    document.getElementById('totalIncome').textContent = fmt(stats.income);
    document.getElementById('totalExpense').textContent = fmt(stats.expense);
    var rateEl = document.getElementById('savingsRate');
    if(stats.income > 0){
      var rate = ((stats.income - stats.expense) / stats.income) * 100;
      rateEl.textContent = rate.toFixed(0) + '%';
      rateEl.style.color = rate >= 0 ? 'var(--mint)' : 'var(--clay)';
    } else { rateEl.textContent = '—'; rateEl.style.color = 'var(--ink)'; }
  }

  function renderBars(stats){
    var el = document.getElementById('bars');
    var entries = Object.keys(stats.catTotals).map(function(k){ return [k, stats.catTotals[k]]; });
    entries.sort(function(a,b){ return b[1]-a[1]; });
    if(entries.length === 0){ el.innerHTML = '<div class="empty">Add an expense to see the breakdown.</div>'; return; }
    var max = entries[0][1];
    el.innerHTML = entries.map(function(e){
      var pct = max > 0 ? (e[1]/max*100) : 0;
      var capPct = SUGGESTED_PCT[e[0]] || 5;
      var capAmt = stats.income > 0 ? (stats.income * capPct/100) : null;
      var over = capAmt !== null && e[1] > capAmt;
      var capText = capAmt !== null ? ('suggested cap ~'+fmt(capAmt)) : '';
      return '<div class="bar-row"><div class="top"><span>'+e[0]+'</span><span>'+fmt(e[1])+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill'+(over?' over':'')+'" style="width:'+pct.toFixed(1)+'%"></div></div>'+
        (capText ? '<div class="bar-cap">'+capText+'</div>' : '') + '</div>';
    }).join('');
  }

  function renderRecommendations(stats){
    var el = document.getElementById('insights');
    var recs = [];
    var entries = Object.keys(stats.catTotals).map(function(k){ return [k, stats.catTotals[k]]; });
    entries.sort(function(a,b){ return b[1]-a[1]; });

    if(txns.length === 0){
      recs.push({tag:'low', text:'Log a few days of spending and I\'ll start recommending specific moves.'});
    } else {
      if(stats.income > 0 && stats.expense > stats.income){
        recs.push({tag:'high', text:'You\'re spending '+fmt(stats.expense-stats.income)+' more than you earn this month. Start by trimming your top category below before anything else.'});
      }
      entries.forEach(function(e){
        var capPct = SUGGESTED_PCT[e[0]] || 5;
        if(stats.income > 0){
          var capAmt = stats.income * capPct/100;
          if(e[1] > capAmt){
            var over = e[1]-capAmt;
            recs.push({tag:'mid', text:e[0]+' is running '+fmt(over)+' over a typical '+capPct+'% guideline for your income. Trimming it back would close a real gap.'});
          }
        }
      });
      if(goal > 0){
        var projectedSavings = stats.income - stats.expense;
        if(projectedSavings < goal){
          var gap = goal - projectedSavings;
          recs.push({tag:'high', text:'You\'re '+fmt(gap)+' short of your '+fmt(goal)+' savings goal this month. Cutting '+ (entries[0] ? entries[0][0] : 'discretionary spending') +' is the fastest lever.'});
        } else {
          recs.push({tag:'low', text:'You\'re on track to beat your '+fmt(goal)+' savings goal by '+fmt(projectedSavings-goal)+' this month. Nice work.'});
        }
      }
      if(stats.income > 0){
        var rate = (stats.income-stats.expense)/stats.income*100;
        if(rate >= 20){ recs.push({tag:'low', text:'You\'re saving '+rate.toFixed(0)+'% of income — well above the typical 20% target.'}); }
        else if(rate >= 0 && rate < 10){ recs.push({tag:'mid', text:'You\'re saving '+rate.toFixed(0)+'% of income. Pushing toward 10-20% would give you more of a cushion.'}); }
      }
      var smallRecurring = entries.filter(function(e){ return e[1] < 30; });
      if(smallRecurring.length >= 3){
        recs.push({tag:'low', text:smallRecurring.length+' small categories are each under $30. Individually minor, but worth a monthly glance since they add up quietly.'});
      }
    }
    if(recs.length === 0){ recs.push({tag:'low', text:'Your spending looks balanced right now. Nothing stands out.'}); }
    var order = {high:0, mid:1, low:2};
    recs.sort(function(a,b){ return order[a.tag]-order[b.tag]; });
    el.innerHTML = recs.map(function(r){
      return '<div class="rec"><span class="tag '+r.tag+'">'+r.tag+'</span><div>'+r.text+'</div></div>';
    }).join('');
  }

  function render(){
    var stats = computeStats();
    renderHero(stats);
    renderBars(stats);
    renderRecommendations(stats);
    renderList();
  }

  var themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('pocketsmart_ai_theme', next); }catch(e){}
  });
  try{
    var savedTheme = localStorage.getItem('pocketsmart_ai_theme');
    if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  }catch(e){}

  loadAll();
  if(goal) goalInput.value = goal;
  render();
})();
</script>
</body>
</html>
